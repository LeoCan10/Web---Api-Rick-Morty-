<div id="background">
  <nav class="breadcrumb">
    <span class="breadcrumb-item"><a routerLink="/">Home</a></span>
    <span class="breadcrumb-item active">Characters</span>
  </nav>

  <!-- Buscador -->
  <div class="search-container">
    <input class="search-input" type="text" placeholder="Search..." />
    <button class="search-button">Search</button>
  </div>

  <!-- Grid de personajes -->
  <div class="row">
    <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let character of characters">
      <app-character-card [character]="character"></app-character-card>
    </div>
  </div>

  <!-- Paginación -->
  <div class="pagination-container">
    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [maxPagesToShow]="3"
      (pageChange)="changePage($event)"
    ></app-pagination>
  </div>

  <footer class="footer">
    <h6>Rick and Morty Wiki - All rights reserved to John Doe SA</h6>
  </footer>
</div>
